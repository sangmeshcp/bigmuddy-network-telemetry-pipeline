name: release

# Publishes a release when a version tag is pushed:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Produces: GitHub Release with linux/darwin × amd64/arm64 archives,
# checksums, SPDX SBOMs and a keyless cosign signature; and a signed,
# multi-arch image at ghcr.io/<owner>/telemetry-pipeline:<tag> (+ :latest for
# non-pre-releases) with SBOM and provenance attestations.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: verify tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  binaries:
    name: binaries (GoReleaser)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # keyless cosign signing
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}   # changelog needs history
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}

  image:
    name: container image (multi-arch, signed)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/telemetry-pipeline
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do cosign sign --yes "${tag}@${DIGEST}"; done
      - name: verify signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "ghcr.io/${{ github.repository_owner }}/telemetry-pipeline@${DIGEST}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified"

  chart:
    name: Helm chart (OCI, GHCR)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with: {version: v3.19.0}
      - name: package with the release version and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          helm package deploy/helm/telemetry-pipeline --version "$VERSION" --app-version "$TAG" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/telemetry-pipeline-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
