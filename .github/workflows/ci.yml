name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: also runs the optional real-device job
  workflow_dispatch:
    inputs:
      real_device:
        description: "Also test gNMI against a real NOS (Nokia SR Linux)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: lint (gofmt, vet, staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d .; exit 1)
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags integration ./...

  # ---------------------------------------------------------------------------
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: test (race, coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=coverage.out | grep -v '/internal/gen/' | awk '{printf "%-90s %s\n", $1, $NF}' | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  # ---------------------------------------------------------------------------
  proto:
    name: proto (lint + generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: install generators (versions match committed code)
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          GOTOOLCHAIN=auto go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - run: buf lint
      - name: regenerate and diff
        run: |
          buf generate
          git diff --exit-code internal/gen || (echo "::error::generated code is stale; run 'make generate'"; exit 1)

  # ---------------------------------------------------------------------------
  integration-backends:
    name: integration (InfluxDB, Kafka, Prometheus)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: start InfluxDB 2, Kafka (KRaft), Prometheus 3
        run: |
          docker run -d --name influxdb -p 8086:8086 \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME=ci -e DOCKER_INFLUXDB_INIT_PASSWORD=ci-password \
            -e DOCKER_INFLUXDB_INIT_ORG=ci -e DOCKER_INFLUXDB_INIT_BUCKET=telemetry \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ci-token \
            influxdb:2.7
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.0
          docker run -d --name prometheus -p 9090:9090 prom/prometheus:v3.4.0 \
            --config.file=/etc/prometheus/prometheus.yml --web.enable-otlp-receiver
      - name: wait for services
        run: |
          wait_for() { for i in $(seq 1 60); do eval "$2" >/dev/null 2>&1 && { echo "$1 ready"; return 0; }; sleep 2; done; echo "$1 not ready"; docker logs "$1" | tail -50; return 1; }
          wait_for influxdb "curl -fsS localhost:8086/health"
          wait_for prometheus "curl -fsS localhost:9090/-/ready"
          wait_for kafka "docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
      - name: integration tests
        env:
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-token
          INFLUX_ORG: ci
          INFLUX_BUCKET: telemetry
          KAFKA_BROKERS: localhost:9092
          PROMETHEUS_URL: http://localhost:9090
        run: go test -tags integration -count=1 -v -run 'TestInfluxDB2|TestKafka|TestPrometheusOTLP' ./integration/
      - name: service logs on failure
        if: failure()
        run: for c in influxdb kafka prometheus; do echo "=== $c"; docker logs $c 2>&1 | tail -80; done

  # ---------------------------------------------------------------------------
  integration-gnmi:
    name: integration (gNMI, OpenConfig reference target, mTLS)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: start OpenConfig reference gNMI target (fake_server)
        run: scripts/gnmi-reference-target.sh start > "$RUNNER_TEMP/gnmi.env"
      - name: gNMI integration test
        run: |
          source "$RUNNER_TEMP/gnmi.env"
          go test -tags integration -count=1 -v -run TestGNMITarget ./integration/
      - name: target log on failure
        if: failure()
        run: cat "${TMPDIR:-/tmp}/gnmi-reference-target/server.log" || true
      - name: stop target
        if: always()
        run: scripts/gnmi-reference-target.sh stop

  # Optional: the same test against a real network OS. Not on the PR path
  # (vendor image, slow boot); runs weekly and on manual dispatch.
  integration-device:
    name: integration (gNMI, real NOS - Nokia SR Linux)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.real_device)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"
      - name: deploy SR Linux
        run: sudo containerlab deploy -t integration/srlinux.clab.yml
      - name: gNMI integration test
        env:
          GNMI_TARGET: clab-itest-srl:57400
          GNMI_USERNAME: admin
          GNMI_PASSWORD: NokiaSrl1!
          GNMI_PATH: /interface/statistics
        run: go test -tags integration -count=1 -v -run TestGNMITarget ./integration/
      - name: device logs on failure
        if: failure()
        run: |
          sudo containerlab inspect -t integration/srlinux.clab.yml || true
          docker logs clab-itest-srl 2>&1 | tail -100
      - name: destroy lab
        if: always()
        run: sudo containerlab destroy -t integration/srlinux.clab.yml --cleanup || true

  # ---------------------------------------------------------------------------
  lakehouse:
    name: integration (ClickHouse, Parquet on S3, Iceberg REST, PyIceberg, Kafka Avro)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      # S3 API: SeaweedFS (MinIO no longer publishes container images), with
      # SigV4 credentials enforced. The MINIO_* variable names are historical:
      # the tests take any S3-compatible endpoint.
      - name: start ClickHouse and an S3 server (host network, so ClickHouse can reach S3)
        run: |
          docker run -d --name clickhouse --network host \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 --ulimit nofile=262144:262144 \
            clickhouse/clickhouse-server:25.8
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"minioadmin","secretKey":"minioadmin"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 --network host -v "$RUNNER_TEMP/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.52 server -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -s3 -s3.port=9100 -s3.config=/etc/seaweedfs/s3.json \
            -s3.port.iceberg=0 -s3.port.lance=0   # its own Iceberg catalog would take :8181
          for i in $(seq 1 60); do
            curl -fsS 127.0.0.1:8123/ping >/dev/null 2>&1 && [ "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:9100/)" != 000 ] && break
            sleep 2
          done
          curl -fsS '127.0.0.1:8123/?query=SELECT%20version()'
          # anonymous requests must be refused: credentials are really checked
          code=$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:9100/); echo "anonymous S3 request: $code"
          case $code in 401|403) ;; *) exit 1 ;; esac
      - name: clickhouse output (conformance, dedup, DDL, errors) against a real server
        env: {CLICKHOUSE_ADDR: "127.0.0.1:9000"}
        run: go test -race -count=1 -v ./internal/output/clickhouse/
      - name: Parquet on S3, read back by ClickHouse s3()
        env:
          MINIO_ENDPOINT: "127.0.0.1:9100"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          CLICKHOUSE_HTTP: "http://127.0.0.1:8123"
        run: go test -tags integration -count=1 -v -run TestParquetOnMinIOReadByClickHouse ./integration/
      - name: start Iceberg REST catalog (data files on S3)
        run: |
          docker run -d --name iceberg-rest --network host \
            -e CATALOG_WAREHOUSE=s3://warehouse/ \
            -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
            -e CATALOG_S3_ENDPOINT=http://127.0.0.1:9100 \
            -e CATALOG_S3_PATH__STYLE__ACCESS=true \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin -e AWS_REGION=us-east-1 \
            apache/iceberg-rest-fixture:1.10.0
          for i in $(seq 1 60); do curl -fsS 127.0.0.1:8181/v1/config >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS 127.0.0.1:8181/v1/config
          # make sure :8181 is the fixture, not something else on the host network
          test "$(docker inspect -f '{{.State.Running}}' iceberg-rest)" = true
      - name: iceberg output through the REST catalog (write, dedup retry, scan back)
        env:
          ICEBERG_REST_URI: "http://127.0.0.1:8181"
          ICEBERG_WAREHOUSE_BUCKET: warehouse
          MINIO_ENDPOINT: "127.0.0.1:9100"
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: go test -tags integration -count=1 -v -run TestIcebergRESTOnMinIO ./integration/
      - name: iceberg interop (table written by iceberg-go, read by PyIceberg)
        run: |
          pip install --quiet "pyiceberg[sql-sqlite,pyarrow]==0.10.0"
          dir=$(mktemp -d)
          ICEBERG_INTEROP_DIR=$dir go test -count=1 -run TestInteropExport ./internal/output/iceberg/
          python3 scripts/pyiceberg-check.py "$dir"
      - name: start Redpanda (Kafka API + Schema Registry)
        run: |
          docker run -d --name redpanda --network host docker.redpanda.com/redpandadata/redpanda:v24.3.6 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr 127.0.0.1:9092 --advertise-kafka-addr 127.0.0.1:9092 \
            --schema-registry-addr 127.0.0.1:8081 --pandaproxy-addr 127.0.0.1:8082 \
            --rpc-addr 127.0.0.1:33145 --advertise-rpc-addr 127.0.0.1:33145
          for i in $(seq 1 60); do curl -fsS 127.0.0.1:8081/subjects >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS 127.0.0.1:8081/subjects
      - name: kafka format avro on Redpanda, decoded by ClickHouse AvroConfluent
        env:
          KAFKA_BROKERS: "127.0.0.1:9092"
          SCHEMA_REGISTRY_URL: "http://127.0.0.1:8081"
          CLICKHOUSE_HTTP: "http://127.0.0.1:8123"
        run: go test -tags integration -count=1 -v -run TestKafkaAvroReadByClickHouse ./integration/
      - name: service logs on failure
        if: failure()
        run: for c in clickhouse s3 iceberg-rest redpanda; do echo "=== $c"; docker logs $c 2>&1 | tail -60; done

  # ---------------------------------------------------------------------------
  docker:
    name: container image + smoke test
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: telemetry-pipeline:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image checks
        run: |
          docker run --rm telemetry-pipeline:ci -version
          docker run --rm telemetry-pipeline:ci -config /etc/pipeline/pipeline.yaml -check
          # Numeric non-root user: required for Kubernetes runAsNonRoot verification
          test "$(docker image inspect telemetry-pipeline:ci --format '{{.Config.User}}')" = "65532:65532"
          docker image inspect telemetry-pipeline:ci --format 'size: {{.Size}} bytes'
      - name: run container
        run: docker run -d --name pipeline -p 9180:9180 -p 9273:9273 -p 57500:57500 telemetry-pipeline:ci
      - name: smoke test (replay captured IOS XR telemetry)
        run: scripts/smoke.sh
      - name: graceful shutdown
        run: |
          docker stop -t 30 pipeline
          code=$(docker inspect pipeline --format '{{.State.ExitCode}}')
          docker logs pipeline 2>&1 | tail -5
          test "$code" = "0" || { echo "::error::exit code $code"; exit 1; }
      - name: container logs on failure
        if: failure()
        run: docker logs pipeline 2>&1 | tail -100

  # ---------------------------------------------------------------------------
  release-dry-run:
    name: release rehearsal (GoReleaser snapshot + multi-arch image)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
      - name: check artifacts
        run: |
          ls -l dist/*.tar.gz dist/*checksums.txt dist/*.sbom.json
          test "$(ls dist/*.tar.gz | wc -l)" -eq 4
          ./dist/pipeline_linux_amd64_v1/pipeline -version
      - uses: docker/setup-buildx-action@v4
      - name: build image for amd64 + arm64 (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  helm:
    name: helm chart (lint, schema, install on kind, upgrade, rollback)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    env:
      CHART: deploy/helm/telemetry-pipeline
      REL: tp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: azure/setup-helm@v5
        with: {version: v3.19.0}
      - name: lint and schema-validate (default and all features on)
        run: |
          helm lint "$CHART" --strict
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          helm template t "$CHART" | kubeconform -strict -summary
          helm template t "$CHART" -f "$CHART/ci/all-features-values.yaml" | kubeconform -strict -summary -skip ServiceMonitor,PrometheusRule
      - name: rendered config passes pipeline -check
        run: |
          make build
          helm template t "$CHART" --show-only templates/configmap.yaml \
            | python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["data"]["pipeline.yaml"])' > /tmp/cfg.yaml
          ./bin/pipeline -config /tmp/cfg.yaml -check
      - name: build image
        run: docker build -t telemetry-pipeline:ci --build-arg VERSION=ci .
      - uses: helm/kind-action@v1
      - name: install
        run: |
          kind load docker-image telemetry-pipeline:ci --name chart-testing
          helm install "$REL" "$CHART" --wait --timeout 3m \
            --set image.repository=telemetry-pipeline --set image.tag=ci --set image.pullPolicy=Never \
            --set dialoutService.type=ClusterIP
          kubectl get pods -o wide
      - name: helm test
        # No --logs: a passing test pod is deleted by its hook-delete-policy;
        # failed test pods are kept and shown by the diagnostics step.
        run: helm test "$REL"
      - name: end-to-end through the Services (replay IOS XR telemetry)
        run: |
          kubectl port-forward "svc/$REL-telemetry-pipeline" 9180 9273 >/dev/null 2>&1 &
          kubectl port-forward "svc/$REL-telemetry-pipeline-dialout" 57500 >/dev/null 2>&1 &
          sleep 3
          scripts/smoke.sh
      - name: config change rolls the pods
        run: |
          D="deploy/$REL-telemetry-pipeline"
          sum() { kubectl get $D -o jsonpath='{.spec.template.metadata.annotations.checksum/config}'; }
          rs() { kubectl get $D -o jsonpath='{.status.observedGeneration}'; }
          before=$(sum); gen_before=$(rs)
          helm upgrade "$REL" "$CHART" --reuse-values --set config.log.level=debug --wait --timeout 3m
          kubectl rollout status $D --timeout 2m
          after=$(sum); gen_after=$(rs)
          echo "checksum $before -> $after, generation $gen_before -> $gen_after"
          test "$before" != "$after" && test "$gen_after" -gt "$gen_before"
      - name: invalid config is rejected and rolled back
        run: |
          rev=$(helm history "$REL" -o json | python3 -c 'import sys,json; print(json.load(sys.stdin)[-1]["revision"])')
          if helm upgrade "$REL" "$CHART" --reuse-values --set config.outputs[0].bogus_key=1 \
               --wait --timeout 90s --atomic; then
            echo "::error::upgrade with an invalid config should have failed"; exit 1
          fi
          kubectl rollout status "deploy/$REL-telemetry-pipeline" --timeout 2m
          helm history "$REL"
          helm test "$REL"
          echo "invalid config rejected; release still serving (was revision $rev)"
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get all -o wide
          kubectl describe pods -l app.kubernetes.io/instance=$REL | tail -80
          kubectl logs -l app.kubernetes.io/instance=$REL --all-containers --tail=80 || true
          kubectl logs "$REL-telemetry-pipeline-test-ready" || true

  # ---------------------------------------------------------------------------
  dashboards:
    name: dashboards & alerts (promtool tests, live queries, Grafana provisioning)
    runs-on: ubuntu-latest
    needs: unit
    env:
      PROM_VERSION: "3.4.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - name: install Prometheus + promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar xz
          echo "$PWD/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: alert rules are valid and pass their unit tests
        run: |
          promtool check rules deploy/prometheus/alerts.yaml
          promtool test rules deploy/prometheus/alerts_test.yaml
      - name: generated dashboards and chart copies are up to date
        run: |
          python3 deploy/grafana/generate.py
          git diff --exit-code deploy/grafana deploy/helm/telemetry-pipeline/files \
            || { echo "::error::dashboards are stale: run python3 deploy/grafana/generate.py"; exit 1; }
          cmp deploy/prometheus/alerts.yaml deploy/helm/telemetry-pipeline/files/alerts.yaml \
            || { echo "::error::chart alert rules differ: run make chart-assets"; exit 1; }
      - name: every dashboard query returns data from a live pipeline
        run: PROMETHEUS=prometheus scripts/dashboard-check.sh
      - name: Grafana loads all dashboards from provisioning
        run: |
          docker run -d --name grafana -p 3000:3000 \
            -v "$PWD/deploy/compose/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro" \
            -v "$PWD/deploy/compose/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro" \
            -v "$PWD/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            grafana/grafana:12.0.0
          for i in $(seq 1 60); do curl -fsS localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
          sleep 5
          found=$(curl -fsS -u admin:admin 'localhost:3000/api/search?type=dash-db' \
            | python3 -c 'import sys,json; print(" ".join(sorted(d["uid"] for d in json.load(sys.stdin))))')
          echo "provisioned: $found"
          for uid in telemetry-pipeline-health telemetry-interfaces-openconfig telemetry-interfaces-iosxr telemetry-bgp-openconfig; do
            case " $found " in *" $uid "*) ;; *) echo "::error::dashboard $uid not provisioned"; docker logs grafana | tail -40; exit 1;; esac
            curl -fsS -u admin:admin "localhost:3000/api/dashboards/uid/$uid" >/dev/null
          done
          if docker logs grafana 2>&1 | grep -i 'provisioning' | grep -iE 'level=error|failed'; then
            echo "::error::Grafana reported provisioning errors"; exit 1
          fi

  # ---------------------------------------------------------------------------
  config-examples:
    name: example configs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: make build
      - run: |
          for f in examples/*.yaml deploy/compose/pipeline.yaml; do
            echo "== $f"; GNMI_PASSWORD=x INFLUX_TOKEN=x ./bin/pipeline -config "$f" -check
          done

  # ---------------------------------------------------------------------------
  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
