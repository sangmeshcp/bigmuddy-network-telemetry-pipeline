# Keep dependencies current. Updates are grouped to keep PR noise low;
# CI (including govulncheck) must pass before merging.
#
# Not covered here: images started with `docker run` inside workflow steps
# (ClickHouse, SeaweedFS, Iceberg REST fixture, Redpanda, Kafka, InfluxDB,
# Prometheus, Grafana in .github/workflows/ci.yml). Dependabot cannot parse
# them; bump them by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go-dependencies: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: {interval: weekly}
    groups:
      compose-images: {patterns: ["*"]}
  - package-ecosystem: pip
    directories: [/docs, /scripts]
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
