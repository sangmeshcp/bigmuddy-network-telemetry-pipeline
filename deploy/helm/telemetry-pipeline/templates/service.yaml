apiVersion: v1
kind: Service
metadata:
  name: {{ include "tp.fullname" . }}
  labels: {{- include "tp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "tp.selectorLabels" . | nindent 4 }}
  ports:
    - {name: admin, port: {{ .Values.adminPort }}, targetPort: admin, protocol: TCP}
    - {name: metrics, port: {{ .Values.metricsPort }}, targetPort: metrics, protocol: TCP}
