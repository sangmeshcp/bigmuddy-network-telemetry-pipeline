apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tp.fullname" . }}-test-ready
  labels: {{- include "tp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: readyz
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - >-
          wget -qO- http://{{ include "tp.fullname" . }}:{{ .Values.adminPort }}/readyz &&
          wget -qO- http://{{ include "tp.fullname" . }}:{{ .Values.adminPort }}/metrics | grep -q pipeline_input_metrics_total
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
