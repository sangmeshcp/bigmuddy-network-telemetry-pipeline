global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: network-telemetry
    honor_labels: true
    static_configs: [{targets: ["pipeline:9273"]}]
  - job_name: pipeline-self
    static_configs: [{targets: ["pipeline:9180"]}]
