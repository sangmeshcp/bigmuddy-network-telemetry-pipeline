# One Nokia SR Linux node: a real network OS with a gNMI server, used by
# TestGNMIRealDevice. containerlab configures gNMI on :57400 with TLS and
# the default credentials admin / NokiaSrl1!.
#
#   sudo containerlab deploy -t integration/srlinux.clab.yml
#   GNMI_TARGET=clab-itest-srl:57400 GNMI_USERNAME=admin GNMI_PASSWORD='NokiaSrl1!' \
#     go test -tags integration -run GNMIRealDevice -v ./integration/
name: itest
topology:
  nodes:
    srl:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
